<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ShramShield turns a weather forecast into an enforceable heat-safety shift plan for outdoor workers: WBGT, ACGIH work/rest cycles and water, computed in the browser from published standards."
    />
    <meta name="theme-color" content="#0a0f14" />

    <!-- A plan URL is meant to be shared (?city=&cat=&accl=&shift= restores the exact scenario),
         and the plan text is written to be pasted into WhatsApp. Without these, a shared link
         unfurls as a bare URL. No image is declared rather than ship a placeholder one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShramShield" />
    <meta property="og:title" content="ShramShield — heat-safety shift plans for outdoor workers" />
    <meta
      property="og:description"
      content="Turns a weather forecast into an enforceable shift plan: when to start, minutes of work and rest each hour, water per worker, and the hours that must stop. WBGT and ACGIH tables, computed in the browser."
    />
    <meta property="og:url" content="https://shramshield.vercel.app" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ShramShield — heat-safety shift plans for outdoor workers" />
    <meta
      name="twitter:description"
      content="A weather forecast becomes an enforceable heat-safety shift plan: start time, work/rest minutes, water, stop-work hours."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0f14'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f2b13c'/%3E%3Cg stroke='%23f2b13c' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M16 3v4M16 25v4M3 16h4M25 16h4M7 7l3 3M22 22l3 3M25 7l-3 3M10 22l-3 3'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>ShramShield — heat-safety shift planner (WBGT)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
